<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Almacén de Consumibles · Bonyard</title>
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#0F2A33;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.l{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
.b{font-weight:800;letter-spacing:3px;font-size:28px}
.s{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#3FC1A9;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
button{height:50px;padding:0 22px;border-radius:12px;border:0;background:#157A6B;color:#fff;font-size:17px;font-weight:700}
</style>
</head>
<body>
<div class="l" id="l"><div class="b">BONYARD</div><div class="s" role="status" aria-label="Cargando"></div><div id="m">Cargando almacén de consumibles…</div></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbx4Ypo8Nz6p1UdhK9oH4Xy-MNGH2lfN88ljQBoO7eFxWHOOWRYOTKWrozkhg-SnN18jYQ/exec';
  function show(html) {
    html = html.replace('<head>', '<head><script>window.API_URL=' + JSON.stringify(API) + ';<\/script>')
               .replace('<base target="_top">', '');
    document.open(); document.write(html); document.close();
  }
  function fail() {
    document.getElementById('l').innerHTML = '<div class="b">BONYARD</div><div>No se pudo cargar la app.<br>Revisa tu conexión a internet.</div><button onclick="location.reload()">Reintentar</button>';
  }
  fetch(API + '?bundle=1&t=' + Date.now(), { redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (h) { if (h.indexOf('id="root"') < 0) throw new Error('bad'); show(h); })
    .catch(fail);
})();
</script>
</body>
</html>
